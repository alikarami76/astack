# flynn overlay: the flynn tab's static files and its chat API.
# The panel's live connection (WebSocket): chat events down, actions up, the canvas selection when it changes.
location = /flynn/api/ws {
    proxy_pass http://host.docker.internal:8772/api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /flynn/api/ {
    proxy_pass http://host.docker.internal:8772/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    add_header Cache-Control "no-store";
}

location /flynn/ {
    alias /var/www/flynn/;
    add_header Cache-Control "no-store";
}

# Landing page (D4). Signed-out visitors (no Penpot `auth-token` cookie) get /flynn/landing.html at the bare root.
# Everyone else gets Penpot's app exactly as before (the same index.html the catch-all `location /` serves).
# Deep links use the URL hash (/#/auth/...), which nginx never sees, so landing.html sends any visitor that
# arrives with a hash straight on to /?app=1<hash>; `?app=1` skips the landing page (the Sign in button uses it).
location = / {
    set $flynn_landing "1";
    if ($http_cookie ~* "(^|;\s*)auth-token=[^;]") {
        set $flynn_landing "";
    }
    if ($arg_app != "") {
        set $flynn_landing "";
    }
    if ($flynn_landing) {
        rewrite ^ /flynn/landing.html last;
    }
    include /etc/nginx/nginx-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, max-age=0" always;
    rewrite ^ /index.html last;
}
