<!doctype html>
<html lang="{{lang}}" dir="{{dir}}"><head><meta charset="utf-8"><meta name="viewport" content="width=1600"><title>{{title}}</title>
<style>
{{base_css}}
:root { --accent: var(--amber); }
body { background: var(--g1); }
.card { padding: 0; }
.left { position: absolute; top: 80px; bottom: 72px; inset-inline-start: 80px; width: 470px; display: flex; flex-direction: column; justify-content: space-between; }
.copy { display: flex; flex-direction: column; gap: 28px; }
h1 { font-size: {{title_px}}px; }
.sub { font-size: 27px; }
.chip { font-size: 19px; padding: 10px 16px; }
.meta { grid-auto-flow: row; gap: 20px; border-top: 1.5px solid var(--line-2); padding-top: 24px; }
.meta .mi { flex-direction: row; gap: 16px; align-items: baseline; }
.meta .mi b { width: 110px; flex: none; }
.meta .mi span { font-size: 22px; white-space: normal; }
.plot { position: absolute; top: 80px; bottom: 72px; inset-inline-end: 80px; inset-inline-start: 640px; background: #fff; border-radius: 10px; padding: 40px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1.5px var(--line-2), 0 40px 70px -34px #000; }
.plot::before { content: "Exhibit"; position: absolute; top: 14px; inset-inline-start: 22px; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #7a8794; font-weight: 600; }
[dir=rtl] .plot::before { content: "نمودار"; letter-spacing: 0; font-size: 18px; text-transform: none; }
.plot::after { content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 6px; background: var(--accent); border-radius: 10px 0 0 10px; }
[dir=rtl] .plot::after { border-radius: 0 10px 10px 0; }
.th { width: 100%; height: 100%; background: #fff; display: flex; align-items: center; justify-content: center; }
.th img { width: 100%; height: auto; max-height: 100%; object-fit: contain; }
.th2, .th3 { display: none; }
.th.ph { background: #eef1f5; min-width: 0; min-height: 0; }
</style></head>
<body><div class="card">
  <div class="left">
    <div class="copy"><span class="kind">{{kind_label}}</span><h1>{{title}}</h1><p class="sub">{{subtitle}}</p><div class="chips">{{chips_html}}</div></div>
    <div class="meta"><div class="mi"><b>{{l_system}}</b><span>{{system}}</span></div><div class="mi"><b>{{l_date}}</b><span>{{date}}</span></div></div>
  </div>
  <div class="plot">{{thumbs_html}}</div>
</div></body></html>
