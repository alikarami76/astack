<!doctype html>
<html lang="{{lang}}" dir="{{dir}}"><head><meta charset="utf-8"><meta name="viewport" content="width=1600"><title>{{title}}</title>
<style>
{{base_css}}
:root { --accent: #b4580a; --paper: #f3efe7; }
body { background: var(--paper); color: #3b362e; }
.card { padding: 56px 72px 56px; display: grid; grid-template-rows: auto 1fr auto; }
.mast { display: flex; justify-content: space-between; align-items: baseline; gap: 40px; border-top: 6px solid #17130e; border-bottom: 1.5px solid #17130e; padding: 18px 0 16px; }
.mast .kind { color: #17130e; font-size: 24px; }
.mast .kind::before { background: var(--accent); }
.mast .issue { font-size: 24px; color: #3b362e; text-align: end; max-width: 1000px; }
.mast .issue b { color: var(--accent); font-weight: 600; }
.body { display: grid; grid-template-columns: 1fr 560px; gap: 80px; align-items: stretch; padding-top: 48px; min-height: 0; }
.copy { display: flex; flex-direction: column; gap: 30px; justify-content: center; padding-bottom: 20px; }
h1 { font-size: {{title_px}}px; color: #17130e; }
.sub { color: #4d463b; border-inline-start: 5px solid var(--accent); padding-inline-start: 24px; }
.chip { color: #17130e; box-shadow: inset 0 0 0 1.5px rgba(23,19,14,.35); }
.sheets { position: relative; margin-bottom: -1px; }
.th { position: absolute; background: #fff; border-radius: 4px; box-shadow: 0 30px 50px -24px rgba(23,19,14,.45), 0 0 0 1px rgba(23,19,14,.12); }
.th1 { top: 0; bottom: 0; inset-inline-end: 70px; width: 460px; z-index: 2; border-radius: 4px 4px 0 0; }
.th2 { top: 44px; bottom: 0; inset-inline-end: 0; width: 400px; z-index: 1; transform: rotate(3deg); transform-origin: bottom; border-radius: 4px 4px 0 0; }
[dir=rtl] .th2 { transform: rotate(-3deg); }
.th3 { display: none; }
.th.ph { background: #e8e2d6; min-width: 0; min-height: 0; }
.th img { height: 100%; }
.foot { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1.5px solid #17130e; padding-top: 22px; }
.meta .mi b { color: #7a7060; } .meta .mi span { color: #17130e; }
</style></head>
<body><div class="card">
  <div class="mast"><span class="kind">{{kind_label}}</span><span class="issue"><b>{{date}}</b> &nbsp;·&nbsp; {{system}}</span></div>
  <div class="body">
    <div class="copy"><h1>{{title}}</h1><p class="sub">{{subtitle}}</p></div>
    <div class="sheets">{{thumbs_html}}</div>
  </div>
  <div class="foot"><div class="chips">{{chips_html}}</div><div class="meta"><div class="mi"><span>{{options_text}}</span></div><div class="mi"><span>{{picked_text}}</span></div></div></div>
</div></body></html>
