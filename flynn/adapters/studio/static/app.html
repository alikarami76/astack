<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flynn Studio · App</title>
<link rel="icon" type="image/png" href="/static/flynn-logo-64.png">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/studio.css">
<link rel="stylesheet" href="/static/chat.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="rail-slot" data-page="app"></div>
<script src="/static/rail.js"></script>
<header class="top">
  <button class="rail-toggle" type="button" data-rail-toggle title="Sidebar" aria-label="Open sidebar"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg></button>
  <a class="brand" href="/"><img class="mark" src="/static/flynn-logo.png" width="26" height="26" alt=""><span class="word">Flynn</span><span class="sub">Studio</span></a>
  <span class="crumb"><svg class="chev" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M3.5 1.5 7 5l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><a href="/apps">Apps</a><svg class="chev" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M3.5 1.5 7 5l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><b id="appname"></b></span>
  <div class="grow"></div>
</header>
<div class="appshell" id="appshell">
  <aside class="side app-chat" id="app-side"><div class="resize" id="resize"></div><div class="pane chat" id="chat"></div></aside>
  <main class="app-main">
    <div class="app-bar">
      <div class="seg" id="views"><button data-v="preview" class="on">Preview</button><button data-v="code">Code</button><button data-v="versions">Versions</button></div>
      <div class="seg sm" id="sizes"><button data-w="100%" class="on">Desktop</button><button data-w="820px">Tablet</button><button data-w="390px">Phone</button></div>
      <span class="grow"></span>
      <span class="app-status" id="status"></span>
      <button class="btn sm" id="install" hidden>Install packages</button>
      <button class="btn sm" id="run" hidden>Start preview</button>
      <span class="app-ai" id="ai" hidden></span>
      <button class="btn sm" id="ai-on" hidden title="Give this app AI features through the Claude Agent SDK">Enable AI</button>
      <button class="btn ghost sm icon" id="reload" title="Reload the preview" aria-label="Reload"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2.5v3h-3"/></svg></button>
      <a class="btn ghost sm" id="open" target="_blank" hidden>Open ↗</a>
    </div>
    <div class="app-view" id="v-preview"><div class="app-frame" id="frame-wrap"><iframe id="frame" title="App preview"></iframe><div class="app-empty" id="empty"></div></div></div>
    <div class="app-view code" id="v-code" hidden><nav class="app-tree" id="tree"></nav><pre class="app-src" id="src"><span class="faint">Pick a file.</span></pre></div>
    <div class="app-view" id="v-versions" hidden><div class="app-versions" id="versions"></div></div>
  </main>
</div>
<script src="/static/glass.js"></script>
<script src="/static/chat.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
