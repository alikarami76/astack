<!doctype html>
<html lang="en" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flynn Studio</title>
<link rel="icon" type="image/png" href="/static/flynn-logo-64.png">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/studio.css">
<link rel="stylesheet" href="/static/chat.css">
</head>
<body>
<div class="railshell">
<div id="rail-slot" data-page="home"></div>
<script src="/static/rail.js"></script>
<div class="railmain">
<div class="homeshell" id="homeshell">
<main class="home">
  <h1>Everything Flynn has made</h1>
  <div class="sub">Open a run to compare its options and versions, talk to Flynn about it, comment, pick one and export.</div>
  <div class="areas" id="areas" role="tablist">
    <button data-a="all" class="on">All<span></span></button><button data-a="ui">UI designs<span></span></button><button data-a="doc">Docs<span></span></button><button data-a="other">Other<span></span></button>
  </div>
  <div class="kinds" id="kinds" hidden></div>
  <div class="filters">
    <input id="q" placeholder="Search…">
    <select class="sel" id="sys"><option value="">All design systems</option></select>
    <select class="sel" id="seg"><option value="all">Any status</option><option value="open">Open</option><option value="comments">Has comments</option><option value="decided">Decided</option></select>
  </div>
  <div class="grid" id="grid"></div>
</main>
<aside class="side home-side" id="home-side" hidden><div class="pane chat" id="home-chat"></div></aside>
</div>
</div>
</div>
<script src="/static/glass.js"></script>
<script src="/static/chat.js"></script>
<script src="/static/home.js"></script>
</body>
</html>
