<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long page fixture</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; color: #222; }
  /* app shell: the page itself does not scroll; .main does (like many admin panels) */
  .shell { display: grid; grid-template-columns: 220px 1fr; height: 100vh; }
  .side { background: #1f2933; color: #fff; padding: 16px; }
  .main { overflow-y: auto; background: #f4f5f7; }
  .topbar { position: sticky; top: 0; z-index: 5; height: 56px; background: #fff; border-bottom: 1px solid #ddd;
            display: flex; align-items: center; padding: 0 24px; font-weight: 600; }
  .content { padding: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { background: #fff; border-radius: 12px; border: 1px solid #e3e5e8; padding: 16px; height: 180px; }
  .card .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; background: #e0f2ff; color: #0369a1; font-size: 12px; }
  .card img { display: block; width: 100%; height: 80px; margin-top: 12px; background: #eee; border-radius: 8px; }
  .Button-a1B2c3 { margin-top: 10px; height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: #0ea5e9; color: #fff; }
  .hero { height: 60vh; background: linear-gradient(135deg, #0ea5e9, #6366f1); color: #fff; display: grid; place-items: center; font-size: 28px; }
  .fab { position: fixed; right: 24px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%; background: #ef4444; color: #fff;
         display: grid; place-items: center; font-size: 24px; z-index: 9; }
  .marker { grid-column: 1 / -1; height: 40px; background: #fde68a; display: flex; align-items: center; padding: 0 12px; font-weight: 600; }
</style></head>
<body>
<div class="shell">
  <nav class="side">Sidebar<br><br>Orders<br>Products<br>Vouchers</nav>
  <main class="main">
    <div class="topbar">Sticky top bar</div>
    <div class="hero">Hero sized 60vh</div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="fab">+</div>
<script>
  const c = document.getElementById('content');
  for (let i = 1; i <= 36; i++) {
    if (i % 9 === 1) c.insertAdjacentHTML('beforeend', `<div class="marker">Section ${Math.ceil(i / 9)}</div>`);
    c.insertAdjacentHTML('beforeend', `<div class="card"><span class="badge">Card ${i}</span>
      <img data-src="x" alt=""><button class="Button-a1B2c3">Action ${i}</button></div>`);
  }
  // lazy images: they get a colour only once scrolled into view
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.style.background = '#a7f3d0'; io.unobserve(e.target); } }));
  document.querySelectorAll('img[data-src]').forEach((i) => io.observe(i));
</script>
</body></html>
