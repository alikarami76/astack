[project]
name = "pdfsmith"
version = "0.1.0"
description = "Build checked PDFs from Markdown or HTML with themes and first-class Persian support"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.49",
  "pymupdf>=1.24",
  "pikepdf>=9.0",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "fonttools>=4.50",
  "brotli>=1.1",
  "jdatetime>=5.0",
]

[project.scripts]
pdfsmith = "pdfsmith.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "chrome: needs Google Chrome or Playwright Chromium",
  "tectonic: needs the tectonic LaTeX engine",
]
filterwarnings = [
  # jdatetime calls locale.getdefaultlocale(), deprecated since Python 3.11
  "ignore:'locale.getdefaultlocale' is deprecated:DeprecationWarning:jdatetime",
  # PyMuPDF's SWIG bindings on import: "builtin type SwigPyPacked has no __module__ attribute"
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
